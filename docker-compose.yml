services:

  backend:
    build: ./backend
    expose:
      - "5001"
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017/loan_prediction_db

  ml_service:
    build: ./ml_service
    expose:
      - "8000"

  frontend:
    build: ./frontend
    expose:
      - "5173"

  nginx:
    image: nginx:latest
    ports:
      - "444:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./backend/cert.pem:/etc/nginx/cert.pem
      - ./backend/key.pem:/etc/nginx/key.pem
    depends_on:
      - frontend
      - backend
      - ml_service