services:

  backend:
    build: ./backend
    ports:
      - "5001:5001"
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017/loan_prediction_db

  ml_service:
    build: ./ml_service
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
  nginx:
    image: nginx:latest
    ports:
    - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./backend/cert.pem:/etc/nginx/cert.pem
      - ./backend/key.pem:/etc/nginx/key.pem
    depends_on:
      - frontend
      - backend